
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>Personal Expense Tracker</h1>
    </nav>

    <main class="container">
        <section class="page-heading">
            <h2>Financial Dashboard</h2>
            <p>Manage your income and expenses in one place.</p>
        </section>

        <section class="summary-cards">
            <div class="summary-card">
                <p>Total Income</p>
                <h3 id="total-income">LKR 0.00</h3>
            </div>

            <div class="summary-card">
                <p>Total Expenses</p>
                <h3 id="total-expenses">LKR 0.00</h3>
            </div>

            <div class="summary-card">
                <p>Current Balance</p>
                <h3 id="current-balance">LKR 0.00</h3>
            </div>
        </section>

        <section class="panel">
            <h2>Add a Transaction</h2>

            <form id="transaction-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Monthly allowance" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (LKR)</label>
                        <input type="number" id="amount" min="0.01" step="0.01" placeholder="Enter amount" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select a category</option>
                            <option value="Allowance">Allowance</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group date-group">
                        <label for="date">Transaction Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="primary-button">Add Transaction</button>
                    <button type="reset" id="clear-button" class="secondary-button">Clear Form</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>Transaction History</h2>

            <div class="filter-grid">
                <div class="form-group">
                    <label for="filter-type">Filter by Type</label>
                    <select id="filter-type">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expense Only</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="search-box">Search Transactions</label>
                    <input type="search" id="search-box" placeholder="Search by description or category">
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Amount (LKR)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
